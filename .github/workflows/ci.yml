name: ci
# Build + test gate. Runs on pull requests and feature-branch pushes, and is called by release.yml
# for every push to main, so nothing is released without passing it first.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags are mutable). Review before bumping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Coding standards
        run: bash tools/check-standards.sh

      - name: Restore (locked to packages.lock.json)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
